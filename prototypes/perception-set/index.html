<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b29">
<title>Perceptle — The perception set</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap');
:root{--ink:#edf2eb;--muted:#9aa9a7;--bg:#101b29;--panel:#192838;--panel2:#203344;--line:#344755;--lime:#c5ed83;--coral:#ff8b72;--blue:#8cc9df;--radius:22px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 4%,#1c3442 0,transparent 38%),var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:22px 22px 38px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff17;padding:4px 0 20px}.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800;letter-spacing:-.04em}.mark{width:29px;height:29px;border-radius:9px;background:var(--lime);display:grid;place-items:center;color:#17251d;font-size:18px}.edition{font:11px 'DM Mono',monospace;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}.main{max-width:690px;margin:32px auto}.eyebrow{font:11px 'DM Mono',monospace;color:var(--lime);text-transform:uppercase;letter-spacing:.13em}.title{font-size:clamp(32px,7vw,52px);letter-spacing:-.055em;line-height:1.02;margin:12px 0}.sub{color:#b7c2be;line-height:1.6;margin:12px 0 25px;max-width:530px}.card{background:linear-gradient(140deg,#1c2d3c,#182635);border:1px solid #ffffff14;border-radius:var(--radius);padding:clamp(20px,5vw,34px);box-shadow:0 22px 70px #0002}.gamehead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.gamehead h2{font-size:25px;letter-spacing:-.04em;margin:7px 0 5px}.gamehead p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}.pill{white-space:nowrap;border:1px solid #ffffff20;border-radius:99px;padding:8px 11px;font:11px 'DM Mono',monospace;color:var(--muted)}.track{display:flex;gap:6px;margin:0 0 25px}.track i{height:4px;flex:1;background:#ffffff1b;border-radius:9px}.track i.done{background:var(--lime)}.prompt{background:#111e2a;border-radius:16px;padding:18px;margin:15px 0 18px}.label{color:var(--muted);font:11px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.1em}.countfield{display:flex;gap:10px;margin-top:12px}.countfield input{min-width:0;flex:1}.input{background:#0f1b27;border:1px solid #455967;border-radius:12px;padding:14px 15px;color:var(--ink);font:16px 'DM Mono',monospace;outline:none}.input:focus{border-color:var(--lime);box-shadow:0 0 0 3px #c5ed831c}button{border:0;cursor:pointer;font:700 14px 'DM Sans',sans-serif;transition:transform .15s,background .15s}button:active{transform:scale(.98)}.primary{background:var(--lime);color:#17251d;border-radius:12px;padding:14px 19px}.primary:hover{background:#d7f5a3}.secondary{background:#ffffff12;color:var(--ink);border:1px solid #ffffff20;border-radius:12px;padding:12px 16px}.arena{position:relative;background:#111e2a;border-radius:16px;overflow:hidden;min-height:220px;margin:16px 0}.arena canvas{display:block;width:100%;height:220px;touch-action:manipulation}.ground-hint{font:11px 'DM Mono',monospace;color:var(--muted);text-align:center;margin:7px}.statrow{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font:12px 'DM Mono',monospace}.timer{color:var(--coral);font-size:22px}.beatpad{width:100%;height:142px;background:#111e2a;border:1px solid #ffffff15;border-radius:16px;color:var(--ink);margin:16px 0;display:grid;place-items:center;touch-action:manipulation}.beatcircle{width:66px;height:66px;border-radius:50%;background:#253a4a;display:grid;place-items:center;color:var(--blue);font:12px 'DM Mono',monospace;transition:transform .08s,background .08s}.beatcircle.pulse{transform:scale(1.25);background:var(--lime);color:#17251d}.tapcount{font:12px 'DM Mono',monospace;color:var(--muted);text-align:center}.linearea{padding:47px 12px 30px;touch-action:manipulation}.line{height:5px;background:#85959b;border-radius:9px;position:relative;cursor:crosshair}.line:before,.line:after{content:'';position:absolute;width:3px;height:17px;background:var(--ink);top:-6px;border-radius:4px}.line:before{left:0}.line:after{right:0}.line-marker{position:absolute;top:50%;width:20px;height:20px;border:3px solid var(--lime);background:var(--bg);border-radius:50%;transform:translate(-50%,-50%);display:none}.endpoints{display:flex;justify-content:space-between;color:var(--muted);font:11px 'DM Mono',monospace;margin-top:13px}.feedback{margin-top:16px;color:var(--lime);font-size:14px;min-height:22px}.bottom{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-top:18px}.quiet{font-size:12px;color:var(--muted);line-height:1.5}.hidden{display:none!important}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:22px 0}.tile{background:#111e2a;border-radius:14px;padding:15px 12px}.tile span{display:block;color:var(--muted);font:10px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em}.tile b{display:block;font-size:24px;margin-top:6px;letter-spacing:-.04em}.resultscore{font-size:clamp(64px,15vw,94px);font-weight:800;line-height:1;letter-spacing:-.08em;color:var(--lime);margin:22px 0 6px}.resultscore small{font-size:22px;color:var(--muted);letter-spacing:0}.resultbadge{display:inline-block;padding:8px 12px;background:#c5ed8318;border:1px solid #c5ed8340;color:var(--lime);border-radius:99px;font:11px 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.09em}.resultbadge.retry{background:#ff8b7218;border-color:#ff8b7240;color:var(--coral)}.dots{position:absolute;inset:0;pointer-events:none}.dot{position:absolute;border-radius:50%;background:var(--lime);box-shadow:0 1px 8px #c5ed8355}.dot:nth-child(3n){background:var(--coral)}.dot:nth-child(4n){background:var(--blue)}@media(max-width:560px){.wrap{padding:16px 15px 28px}.main{margin:23px auto}.top{padding-bottom:15px}.edition{font-size:9px}.gamehead{gap:10px}.gamehead h2{font-size:22px}.pill{padding:7px 9px}.bottom{align-items:stretch;flex-direction:column-reverse}.bottom button{width:100%}.tiles{grid-template-columns:repeat(2,1fr)}.arena,.arena canvas{min-height:205px;height:205px}}
</style></head>
<body><div class="wrap"><header class="top"><div class="brand"><span class="mark">◉</span> SnoozeLoose</div><div class="edition">THE DAILY PERCEPTION SET</div></header><main class="main"><div class="track" id="track"><i></i><i></i><i></i><i></i></div><section id="app"></section></main></div>
<script>
const app=document.querySelector('#app'), track=[...document.querySelectorAll('.track i')];let scores=[], timers=[], state={};
const clearTimers=()=>{timers.forEach(clearTimeout);timers=[]};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function home(){clearTimers();scores=[];track.forEach(x=>x.className='');app.innerHTML=`<div class="eyebrow">FOUR GAMES · ONE SHARP MIND</div><h1 class="title">How well do you<br>read the moment?</h1><p class="sub">A quick perception challenge in four rounds. Trust your eyes, find the angles, and see how close you can get.</p><div class="card"><div class="label">YOUR FOUR ROUNDS</div><div class="tiles"><div class="tile"><span>01 · Estimate</span><b>Count</b></div><div class="tile"><span>02 · Predict</span><b>Track</b></div><div class="tile"><span>03 · Rotate</span><b>Angle</b></div><div class="tile"><span>04 · Place</span><b>Split</b></div></div><div class="statrow"><span>100 POINTS PER GAME</span><span>70 AVG TO WIN</span></div><div class="bottom"><span class="quiet">Takes about 2 minutes · works with touch or mouse</span><button class="primary" id="start">Start the set&nbsp; →</button></div></div>`;document.querySelector('#start').onclick=()=>game1()}
function shell(n,title,desc,rule,body){track.forEach((x,i)=>x.className=i<n-1?'done':'');app.innerHTML=`<div class="eyebrow">ROUND 0${n} / 04</div><div class="gamehead"><div><h2>${title}</h2><p>${desc}</p></div><span class="pill">${rule}</span></div><div class="card">${body}</div>`}
function record(s){scores.push(Math.max(0,Math.min(100,Math.round(s))));track[scores.length-1].className='done';if(scores.length===4)results();else [game1,game2,game3,game4][scores.length]()}
function game1(){clearTimers();let count=36+Math.floor(Math.random()*35),left=5,submitted=false;shell(1,'Quick count','A field of dots will appear. Estimate the total before time runs out.','−3 / DOT OFF',`<div class="statrow"><span>COUNT THE DOTS</span><span class="timer" id="timer">5.0</span></div><div class="arena" id="dotarena"><div class="dots" id="dots"></div></div><div class="label">YOUR ESTIMATE</div><div class="countfield"><input class="input" id="guess" type="number" inputmode="numeric" min="0" placeholder="Enter a number"><button class="primary" id="submit">Lock it in</button></div><div class="feedback" id="feedback">The dots disappear when the clock hits zero.</div>`);let dots=document.querySelector('#dots'),arena=document.querySelector('#dotarena');for(let i=0;i<count;i++){let d=document.createElement('i');d.className='dot';let sz=7+Math.random()*8;d.style.cssText=`width:${sz}px;height:${sz}px;left:${2+Math.random()*94}%;top:${4+Math.random()*90}%`;dots.append(d)}const finish=()=>{if(submitted)return;submitted=true;clearTimers();let v=Number(document.querySelector('#guess').value),score=Number.isFinite(v)&&v>0?100-Math.abs(v-count)*3:0;document.querySelector('#feedback').textContent=`There were ${count} dots. Your score: ${Math.max(0,score)}.`;document.querySelector('#submit').textContent='Next round →';document.querySelector('#submit').onclick=()=>record(score);document.querySelector('#guess').disabled=true};document.querySelector('#submit').onclick=finish;document.querySelector('#guess').addEventListener('keydown',e=>{if(e.key==='Enter')finish()});timers.push(setInterval(()=>{left-=.1;let t=document.querySelector('#timer');if(!t)return;t.textContent=Math.max(0,left).toFixed(1);if(left<=0){arena.style.opacity='.18';finish()}},100))}
function game2(){clearTimers();let target=.15+Math.random()*.7,chosen=null,phase=0,started=performance.now();shell(2,'Follow the flight','Watch the projectile launch. Its trail vanishes after the first third. Tap where you think it will land.','−5 / % OFF',`<div class="statrow"><span id="flightstatus">WATCH THE TRAJECTORY</span><span class="label">TAP THE GROUND</span></div><div class="arena"><canvas id="flight" aria-label="Projectile trajectory. Click the ground to predict its landing point"></canvas></div><div class="ground-hint">Select a landing point along the ground line</div><div class="feedback" id="feedback"></div><div class="bottom"><span class="quiet">Distance from the landing spot is measured as a percent of the field width.</span><button class="primary hidden" id="next">Next round →</button></div>`);let c=document.querySelector('#flight'),ctx=c.getContext('2d'),dpr=devicePixelRatio||1;function draw(){let w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr);let ground=h-35,sx=28,sy=h-35,landx=28+target*(w-56),ex=landx;ctx.strokeStyle='#536776';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(20,ground);ctx.lineTo(w-20,ground);ctx.stroke();if(chosen!==null){ctx.fillStyle='#c5ed83';ctx.beginPath();ctx.arc(landx,ground-5,6,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=.62;ctx.strokeStyle='#8cc9df';ctx.lineWidth=2;ctx.setLineDash([5,5]);ctx.beginPath();let lim=chosen===null?(phase?0:Math.min(1/3,(performance.now()-started)/1500)):1;for(let i=0;i<=60*lim;i++){let t=i/60,x=sx+(ex-sx)*t,y=sy-4*(h*.6)*t*(1-t);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;if(chosen===null&&!phase){let t=Math.min(1/3,(performance.now()-started)/1500),x=sx+(ex-sx)*t,y=sy-4*(h*.6)*t*(1-t);ctx.fillStyle='#8cc9df';ctx.shadowColor='#8cc9df';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}if(chosen!==null){let x=28+chosen*(w-56);ctx.strokeStyle='#ff8b72';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,ground-12);ctx.lineTo(x,ground+5);ctx.stroke()}}draw();let ro=new ResizeObserver(draw);ro.observe(c);function animate(){if(phase===0){draw();requestAnimationFrame(animate)}}requestAnimationFrame(animate);timers.push(setTimeout(()=>{phase=1;draw();timers.push(setTimeout(()=>{document.querySelector('#flightstatus').textContent='YOUR TURN — PICK A SPOT'},650))},1500));c.addEventListener('pointerdown',e=>{if(chosen!==null||phase===0)return;let r=c.getBoundingClientRect();if(e.clientY<r.top+r.height-62)return;chosen=Math.max(0,Math.min(1,(e.clientX-r.left-28)/(r.width-56)));let off=Math.abs(chosen-target)*100,score=100-off*5;draw();document.querySelector('#feedback').textContent=`Landing point: ${Math.round(target*100)}% · You were ${off.toFixed(1)}% off · ${Math.max(0,Math.round(score))} points`;let b=document.querySelector('#next');b.classList.remove('hidden');b.onclick=()=>record(score)})}
function game3(){clearTimers();let requested=30+Math.floor(Math.random()*301),direction=Math.random()<.5?'counter-clockwise':'clockwise',target=direction==='counter-clockwise'?requested:(360-requested)%360,angle=0,locked=false;shell(3,'Read the angle','Drag the ray around the coordinate plane to match the requested rotation.','-3 / ° OFF',`<div class="prompt"><div class="label">ROTATE ${requested}° ${direction.toUpperCase()}</div><div style="font-size:20px;font-weight:700;margin-top:7px">Drag the ray ${direction} from the positive x-axis.</div></div><div class="arena" style="min-height:320px"><canvas id="angleplane" aria-label="Cartesian plane. Drag the ray to set an angle" style="display:block;width:100%;height:320px;touch-action:none"></canvas></div><div class="statrow"><span>DRAG TO SET YOUR RAY</span><span>ESTIMATE BY EYE</span></div><div class="feedback" id="feedback">Drag the ray tip around the plane, then submit.</div><div class="bottom"><span class="quiet">Scoring: 3 points deducted for every degree off.</span><button class="primary" id="submitangle">Lock in angle</button></div>`);let c=document.querySelector('#angleplane'),ctx=c.getContext('2d');function draw(){let w=c.clientWidth,h=c.clientHeight,dpr=window.devicePixelRatio||1;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);let cx=w/2,cy=h/2,r=Math.min(w*.39,h*.39);ctx.strokeStyle='#ffffff20';ctx.lineWidth=1;for(let i=-1;i<=1;i++){let offset=i*r;ctx.beginPath();ctx.moveTo(cx+offset,cy-r);ctx.lineTo(cx+offset,cy+r);ctx.moveTo(cx-r,cy+offset);ctx.lineTo(cx+r,cy+offset);ctx.stroke()}ctx.strokeStyle='#91a2a8';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cx-r-10,cy);ctx.lineTo(cx+r+10,cy);ctx.moveTo(cx,cy+r+10);ctx.lineTo(cx,cy-r-10);ctx.stroke();ctx.fillStyle='#9aa9a7';ctx.font='11px DM Mono, monospace';ctx.fillText('-1',cx-r-8,cy+17);ctx.fillText('1',cx+r-2,cy+17);ctx.fillText('1',cx+8,cy-r+4);ctx.fillText('-1',cx+8,cy+r-2);ctx.fillStyle='#9aa9a7';ctx.fillText('(0, 0)',cx+8,cy+17);let rad=angle*Math.PI/180,x=cx+r*Math.cos(rad),y=cy-r*Math.sin(rad);ctx.strokeStyle='#c5ed83';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.stroke();ctx.fillStyle='#c5ed83';ctx.beginPath();ctx.arc(x,y,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#edf2eb';ctx.beginPath();ctx.arc(cx,cy,4,0,Math.PI*2);ctx.fill();}
draw();let ro=new ResizeObserver(draw);ro.observe(c);function setAngle(e){if(locked)return;let rect=c.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;angle=(Math.atan2(cy-e.clientY,e.clientX-cx)*180/Math.PI+360)%360;draw()}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);setAngle(e)});c.addEventListener('pointermove',e=>{if(c.hasPointerCapture(e.pointerId))setAngle(e)});document.querySelector('#submitangle').onclick=()=>{if(locked)return;locked=true;let off=Math.abs(((angle-target+540)%360)-180),score=Math.max(0,100-off*3);document.querySelector('#feedback').textContent=`${off.toFixed(1)}° off · ${Math.max(0,Math.round(score))} points`;document.querySelector('#submitangle').textContent='Next round ?';document.querySelector('#submitangle').onclick=()=>record(score)}}

function game4(){clearTimers();let tasks=[{text:'20%',pct:20},{text:'1/8',pct:12.5},{text:'1/7',pct:100/7},{text:'1/6',pct:100/6},{text:'1/5',pct:20},{text:'1/4',pct:25},{text:'2/7',pct:200/7},{text:'3/10',pct:30},{text:'1/3',pct:100/3},{text:'3/8',pct:37.5},{text:'2/5',pct:40},{text:'3/7',pct:300/7},{text:'1/2',pct:50},{text:'4/7',pct:400/7},{text:'5/8',pct:62.5},{text:'2/3',pct:200/3},{text:'5/7',pct:500/7},{text:'7/10',pct:70},{text:'3/4',pct:75},{text:'4/5',pct:80},{text:'6/7',pct:600/7},{text:'7/8',pct:87.5},{text:'9/10',pct:90},{text:'80%',pct:80}],task=tasks[Math.floor(Math.random()*tasks.length)],pct=task.pct,side=Math.random()<.5?'right':'left',target=side==='right'?1-pct/100:pct/100,chosen=null;shell(4,'Split the line','Place the marker at the given percentage or fraction, measured from the named side.','−1 / % OFF',`<div class="prompt"><div class="label">MARK ${task.text} FROM THE ${side.toUpperCase()}</div><div style="font-size:20px;font-weight:700;margin-top:7px">Tap the line at ${task.text} from the ${side}.</div></div><div class="linearea"><div class="line" id="line"><span class="line-marker" id="marker"></span></div><div class="endpoints"><span>LEFT</span><span>RIGHT</span></div></div><div class="feedback" id="feedback">Tap anywhere on the line to place your point.</div><div class="bottom"><span class="quiet">Percent off is measured along the full line.</span><button class="primary hidden" id="next">See your result →</button></div>`);let line=document.querySelector('#line'),marker=document.querySelector('#marker');line.addEventListener('pointerdown',e=>{if(chosen!==null)return;let r=line.getBoundingClientRect();chosen=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));marker.style.left=`${chosen*100}%`;marker.style.display='block';let off=Math.abs(chosen-target)*100,score=100-off;document.querySelector('#feedback').textContent=`You were ${off.toFixed(1)}% off · ${Math.max(0,Math.round(score))} points`;let b=document.querySelector('#next');b.classList.remove('hidden');b.onclick=()=>record(score)})}
function results(){clearTimers();track.forEach(x=>x.className='done');let avg=scores.reduce((a,b)=>a+b,0)/4,win=avg>=70;app.innerHTML=`<div class="eyebrow">SET COMPLETE</div><h1 class="title">${win?'Perception, sharpened.':'A little more practice.'}</h1><p class="sub">${win?'You read the set with precision. You win!':'Your average landed below 70. Take another run and see what clicks.'}</p><div class="card"><span class="resultbadge ${win?'':'retry'}">${win?'SET WON':'REPLAY REQUIRED'}</span><div class="resultscore">${Math.round(avg)}<small> / 100 avg</small></div><div class="label">AVERAGE ACROSS FOUR GAMES</div><div class="tiles">${scores.map((s,i)=>`<div class="tile"><span>0${i+1} · ${['Count','Track','Angle','Split'][i]}</span><b>${s}</b></div>`).join('')}</div><div class="statrow"><span>WIN THRESHOLD</span><span>70 / 100</span></div><div class="bottom"><span class="quiet">${win?'Nice work — you cleared the perception set.':'The four rounds will reshuffle on replay.'}</span><button class="primary" id="replay">Play again&nbsp; ↻</button></div></div>`;document.querySelector('#replay').onclick=home}
home();
</script></body></html>
