</style>
  <section class="stage">
    <div class="phone" role="application" aria-label="Playable SnoozeLose perception challenge in iPhone portrait layout">
      <div class="island" aria-hidden="true"></div>
      <div class="screen">
        <div class="statusbar"><span>9:41</span><span class="system-icons">5G  •••</span></div>
        <header class="brand"><span class="brand-mark" aria-hidden="true">🐧</span><span>SnoozeLose</span></header>
        <div class="progress" id="pp-progress" role="img" aria-label="Four-game progress"></div>
        <main class="content" id="pp-content"></main>
        <div class="home-indicator" aria-hidden="true"></div>
      </div>
    </div>
  </section>
  <script>
    (() => {
      const root = document.getElementById('iphone-perception-preview');
      const content = root.querySelector('#pp-content');
      const progress = root.querySelector('#pp-progress');
      let scores = [];
      let round = 0;
      let phase = 'home';
      let nativeVictoryReported = false;
      let timer = null;
      let animation = 0;
      let answer = 0;
      let chosen = null;
      let targetAngle = 0;
      let angle = 0;
      const fractionPrompts = [
        { label: '20%', pct: 20 }, { label: '1/8', pct: 12.5 }, { label: '1/7', pct: 100 / 7 },
        { label: '1/6', pct: 100 / 6 }, { label: '1/5', pct: 20 }, { label: '1/4', pct: 25 },
        { label: '2/7', pct: 200 / 7 }, { label: '3/10', pct: 30 }, { label: '1/3', pct: 100 / 3 },
        { label: '3/8', pct: 37.5 }, { label: '2/5', pct: 40 }, { label: '3/7', pct: 300 / 7 },
        { label: '1/2', pct: 50 }, { label: '4/7', pct: 400 / 7 }, { label: '5/8', pct: 62.5 },
        { label: '2/3', pct: 200 / 3 }, { label: '5/7', pct: 500 / 7 }, { label: '7/10', pct: 70 },
        { label: '3/4', pct: 75 }, { label: '4/5', pct: 80 }, { label: '6/7', pct: 600 / 7 },
        { label: '7/8', pct: 87.5 }, { label: '9/10', pct: 90 }, { label: '80%', pct: 80 }
      ];
      function stopMotion() {
        if (timer) clearInterval(timer);
        timer = null;
        if (animation) cancelAnimationFrame(animation);
        animation = 0;
      }
      function updateProgress() {
        progress.innerHTML = '';
        for (let i = 0; i < 4; i++) {
          const bar = document.createElement('span');
          if (i <= round && phase !== 'home' && phase !== 'finished') bar.classList.add('done');
          if (phase === 'finished') bar.classList.add('done');
          progress.append(bar);
        }
        progress.setAttribute('aria-label', phase === 'home' ? 'Ready to start' : phase === 'finished' ? 'Set complete' : 'Round ' + (round + 1) + ' of 4');
      }
      function startSet() {
        stopMotion();
        scores = [];
        nativeVictoryReported = false;
        round = 0;
        phase = 'question';
        showRound();
      }
      function showRound() {
        stopMotion();
        phase = 'question';
        chosen = null;
        updateProgress();
        if (round === 0) showCount();
        else if (round === 1) showTrack();
        else if (round === 2) showAngle();
        else showSplit();
      }
      function finishRound(score, detail, reveal = '', inline = false) {
        stopMotion();
        const points = Math.max(0, Math.min(100, Math.round(score)));
        scores.push(points);
        phase = 'feedback';
        updateProgress();
        const feedback = '<div class="inline-feedback"><div class="round">ROUND 0' + (round + 1) + ' COMPLETE</div><h1>Nice estimate.</h1><p class="description">' + detail + '</p><div class="card-label">ROUND SCORE</div><div class="result-score">' + points + '<small> / 100</small></div><p class="hint">Your score is added to the four-round average.</p></div>' + reveal + '<div class="home-actions"><button type="button" data-action="next">' + (round === 3 ? 'See my results' : 'Next game') + ' →</button></div>';
        if (inline) { const gameCard = content.querySelector('.card'); gameCard.insertAdjacentHTML('beforeend', '<div class="inline-results">' + feedback + '</div>'); content.querySelectorAll('canvas, .line').forEach(el => { el.style.pointerEvents = 'none'; }); content.querySelectorAll('button[data-action=lock-angle]').forEach(el => { el.disabled = true; }); }
        else content.innerHTML = feedback;
      }
      function showCount() {
        answer = 36 + Math.floor(Math.random() * 35);
        content.innerHTML = '<div class="round">ROUND 01 / 04</div><h1>Quick count</h1><p class="description">A field of dots will appear. Estimate the total before time runs out.</p><section class="card"><div class="timer-row"><span class="card-label">COUNT THE DOTS</span><span id="pp-timer" class="timer">5.0</span></div><div class="dot-field" id="pp-dots" aria-label="A scattered field of dots"></div><div class="label">YOUR ESTIMATE</div><div class="answer-row"><input id="pp-guess" inputmode="numeric" type="number" min="0" max="99" placeholder="Enter a number" aria-label="Your estimated count"><button type="button" data-action="lock-count">Lock it in</button></div><p class="hint">The dots disappear when the clock hits zero.</p></section><div class="footer"><span>−3 POINTS / DOT OFF</span><span>100 POINTS MAX</span></div>';
        const dots = content.querySelector('#pp-dots');
        for (let i = 0; i < answer; i++) {
          const dot = document.createElement('i');
          dot.className = 'dot' + (i % 7 === 2 ? ' coral' : i % 7 === 4 ? ' blue' : '');
          const size = 6 + Math.random() * 5;
          dot.style.cssText = 'width:' + size + 'px;height:' + size + 'px;left:' + (3 + Math.random() * 92) + '%;top:' + (3 + Math.random() * 92) + '%';
          dots.append(dot);
        }
        const started = performance.now();
        timer = setInterval(() => {
          const remaining = Math.max(0, 5 - (performance.now() - started) / 1000);
          const label = content.querySelector('#pp-timer');
          if (label) label.textContent = remaining.toFixed(1);
          if (remaining <= 0) {
            if (dots) dots.style.opacity = '.16';
            lockCount();
          }
        }, 80);
      }
      function lockCount() {
        if (phase !== 'question' || round !== 0) return;
        const field = content.querySelector('#pp-guess');
        const guess = field ? Number(field.value) : NaN;
        const score = Number.isFinite(guess) && guess > 0 ? 100 - Math.abs(guess - answer) * 3 : 0;
        finishRound(score, 'There were ' + answer + ' dots. You were ' + Math.abs(guess - answer || answer) + ' off target.');
      }
      function drawTrack(canvas, progressValue, reveal, markerValue) {
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const dpr = window.devicePixelRatio || 1;
        const w = rect.width, h = rect.height;
        if (!w || !h) return;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const ground = h - 25, startX = 20, endX = 20 + answer * (w - 40);
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = '#536776'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(12, ground); ctx.lineTo(w - 12, ground); ctx.stroke();
        if (progressValue > 0 && progressValue <= 1 / 3) {
          ctx.strokeStyle = '#8cc9df'; ctx.globalAlpha = .7; ctx.lineWidth = 2; ctx.setLineDash([5, 5]); ctx.beginPath();
          for (let i = 0; i <= 40 * progressValue * 3; i++) {
            const t = i / 120, x = startX + (endX - startX) * t, y = ground - 4 * (h * .58) * t * (1 - t);
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
          const t = progressValue, x = startX + (endX - startX) * t, y = ground - 4 * (h * .58) * t * (1 - t);
          ctx.fillStyle = '#8cc9df'; ctx.shadowColor = '#8cc9df'; ctx.shadowBlur = 15; ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
        }
        if (reveal) {
          const x = startX + (endX - startX) * markerValue;
          ctx.fillStyle = '#c5ed83'; ctx.beginPath(); ctx.arc(endX, ground - 5, 5, 0, Math.PI * 2); ctx.fill();
        }
      }
      function horizontalReveal(targetValue, chosenValue, heading) {
        const targetPct = (targetValue * 100).toFixed(1), chosenPct = (chosenValue * 100).toFixed(1);
        return '<section class="card position-card"><div class="card-label">' + heading + ' · TARGET AND YOUR PICK</div><div class="position-track"><span class="position-pin target-pin" style="left:' + targetPct + '%"><i></i><b>TARGET</b></span><span class="position-pin your-pin" style="left:' + chosenPct + '%"><i></i><b>YOUR PICK</b></span></div><div class="position-values"><span>Target ' + targetPct + '%</span><span>Your pick ' + chosenPct + '%</span></div></section>';
      }

      function showTrack() {
        answer = .15 + Math.random() * .7;
        content.innerHTML = '<div class="round">ROUND 02 / 04</div><h1>Follow the flight</h1><p class="description">Watch the launch. The projectile disappears after the first third of its path.</p><section class="card"><div class="timer-row"><span id="pp-track-status" class="card-label">WATCH THE TRAJECTORY</span><span class="card-label">TAP THE GROUND</span></div><div class="arena"><canvas id="pp-track" aria-label="Projectile travels along an arc, then disappears. Tap the ground where you expect it to land." role="img"></canvas></div><p class="arena-hint">Choose a landing point along the ground.</p><p id="pp-track-result" class="hint">The landing point stays hidden until your choice is locked.</p></section><div class="footer"><span>−5 POINTS / % OFF</span><span>100 POINTS MAX</span></div>';
        const canvas = content.querySelector('#pp-track');
        let started = performance.now(), finished = false;
        function frame(now) {
          if (phase !== 'question' || round !== 1) return;
          const elapsed = now - started;
          const t = Math.min(1 / 3, elapsed / 1500 * (1 / 3));
          if (elapsed >= 1500 && !finished) {
            finished = true;
            phase = 'question';
            const status = content.querySelector('#pp-track-status');
            if (status) status.textContent = 'YOUR TURN — PICK A SPOT';
            drawTrack(canvas, 0, false, 0);
          } else drawTrack(canvas, t, false, 0);
          if (!finished) animation = requestAnimationFrame(frame);
        }
        drawTrack(canvas, 0, false, 0);
        animation = requestAnimationFrame(frame);
        canvas.addEventListener('pointerdown', (event) => {
          if (!finished || phase !== 'question' || round !== 1) return;
          const rect = canvas.getBoundingClientRect();
          if (event.clientY < rect.top + rect.height - 55) return;
          chosen = Math.max(0, Math.min(1, (event.clientX - rect.left - 20) / (rect.width - 40)));
          drawTrack(canvas, 0, true, chosen);
          const error = Math.abs(chosen - answer) * 100;
          const score = 100 - error * 5;
          const result = content.querySelector('#pp-track-result');
          if (result) result.textContent = 'Landing point: ' + Math.round(answer * 100) + '% · You were ' + error.toFixed(1) + '% off.';
          finishRound(score, 'You were ' + error.toFixed(1) + '% off the landing point.', horizontalReveal(answer, chosen, 'LANDING POSITION'), true);
        });
      }
      function drawPlane(canvas) {
        const ctx = canvas.getContext('2d'), rect = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
        const w = rect.width, h = rect.height;
        if (!w || !h) return;
        canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const cx = w / 2, cy = h / 2, r = Math.min(w * .39, h * .39);
        ctx.clearRect(0, 0, w, h);
        ctx.strokeStyle = '#ffffff20'; ctx.lineWidth = 1;
        for (let i = -1; i <= 1; i++) {
          const off = i * r; ctx.beginPath(); ctx.moveTo(cx + off, cy - r); ctx.lineTo(cx + off, cy + r); ctx.moveTo(cx - r, cy + off); ctx.lineTo(cx + r, cy + off); ctx.stroke();
        }
        ctx.strokeStyle = '#91a2a8'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx - r - 8, cy); ctx.lineTo(cx + r + 8, cy); ctx.moveTo(cx, cy - r - 8); ctx.lineTo(cx, cy + r + 8); ctx.stroke();
        ctx.fillStyle = '#9aa9a7'; ctx.font = '10px ui-monospace, monospace'; ctx.fillText('−1', cx - r - 8, cy + 15); ctx.fillText('1', cx + r - 2, cy + 15); ctx.fillText('1', cx + 6, cy - r + 3); ctx.fillText('−1', cx + 6, cy + r - 2); ctx.fillText('(0, 0)', cx + 7, cy + 15);
        const rad = angle * Math.PI / 180, x = cx + r * Math.cos(rad), y = cy - r * Math.sin(rad);
        ctx.strokeStyle = '#c5ed83'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.stroke();
        ctx.fillStyle = '#c5ed83'; ctx.beginPath(); ctx.arc(x, y, 8, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#edf2eb'; ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI * 2); ctx.fill();
      }
      function showAngle() {
        const requested = 30 + Math.floor(Math.random() * 301);
        const direction = Math.random() < .5 ? 'counter-clockwise' : 'clockwise';
        targetAngle = direction === 'counter-clockwise' ? requested : (360 - requested) % 360;
        angle = 0;
        content.innerHTML = '<div class="round">ROUND 03 / 04</div><h1>Read the angle</h1><p class="description">Drag the ray from the positive x-axis to match the requested rotation.</p><section class="card"><div class="prompt"><div class="card-label">ROTATE ' + requested + '° ' + direction.toUpperCase() + '</div><div class="prompt-main">Drag the ray ' + direction + '.</div></div><div class="arena"><canvas id="pp-angle" aria-label="Cartesian plane with a draggable ray. No current angle is displayed." role="img"></canvas></div><p class="arena-hint">Estimate by eye, then lock in the ray.</p></section><div class="home-actions"><button type="button" data-action="lock-angle">Lock in angle</button></div><div class="footer"><span>−3 POINTS / DEGREE OFF</span><span>100 POINTS MAX</span></div>';
        const canvas = content.querySelector('#pp-angle');
        drawPlane(canvas);
        let dragging = false;
        function setRay(event) {
          const rect = canvas.getBoundingClientRect(), cx = rect.left + rect.width / 2, cy = rect.top + rect.height / 2;
          angle = (Math.atan2(cy - event.clientY, event.clientX - cx) * 180 / Math.PI + 360) % 360;
          drawPlane(canvas);
        }
        canvas.addEventListener('pointerdown', (event) => {
          dragging = true; canvas.setPointerCapture(event.pointerId); setRay(event);
        });
        canvas.addEventListener('pointermove', (event) => { if (dragging) setRay(event); });
        canvas.addEventListener('pointerup', () => { dragging = false; });
        canvas.addEventListener('pointercancel', () => { dragging = false; });
      }
      function showSplit() {
        const prompt = fractionPrompts[Math.floor(Math.random() * fractionPrompts.length)];
        const side = Math.random() < .5 ? 'right' : 'left';
        const target = side === 'right' ? 1 - prompt.pct / 100 : prompt.pct / 100;
        chosen = null;
        content.innerHTML = '<div class="round">ROUND 04 / 04</div><h1>Split the line</h1><p class="description">Place the marker at the requested distance from the named side.</p><section class="card"><div class="prompt"><div class="card-label">MARK ' + prompt.label + ' FROM THE ' + side.toUpperCase() + '</div><div class="prompt-main">Tap the line at ' + prompt.label + ' from the ' + side + '.</div></div><div class="line-area"><div class="line" id="pp-line"><span id="pp-marker" class="marker" hidden></span></div><div class="ends"><span>LEFT</span><span>RIGHT</span></div></div><p class="arena-hint">Tap anywhere on the line to place your point.</p></section><div class="footer"><span>−1 POINT / % OFF</span><span>100 POINTS MAX</span></div>';
        const line = content.querySelector('#pp-line'), marker = content.querySelector('#pp-marker');
        line.addEventListener('pointerdown', (event) => {
          if (phase !== 'question' || round !== 3 || chosen !== null) return;
          const rect = line.getBoundingClientRect();
          chosen = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
          marker.hidden = false; marker.style.left = (chosen * 100) + '%';
          const error = Math.abs(chosen - target) * 100;
          finishRound(100 - error, 'You were ' + error.toFixed(1) + '% off the requested point.', horizontalReveal(target, chosen, 'REQUESTED SPLIT'), true);
        });
      }
      function showFinal() {
        stopMotion();
        phase = 'finished';
        updateProgress();
        const average = Math.round(scores.reduce((sum, score) => sum + score, 0) / 4);
        const won = average >= 70;
        content.innerHTML = '<div class="round">SET COMPLETE</div><h1>' + (won ? 'You win!' : 'Try again') + '</h1><p class="description">' + (won ? 'Your average cleared the 70-point target.' : 'Your average was below 70. Play the set again.') + '</p><section class="card"><div class="card-label">AVERAGE ACROSS FOUR GAMES</div><div class="result-score">' + average + '<small> / 100</small></div><div class="score-grid">' + scores.map((score, index) => '<div class="score-cell"><span>0' + (index + 1) + ' · ' + ['COUNT', 'TRACK', 'ANGLE', 'SPLIT'][index] + '</span><b>' + score + '</b></div>').join('') + '</div><p class="hint">WIN THRESHOLD · 70 / 100</p></section><div class="home-actions"><button type="button" data-action="replay">Play again →</button></div>';
        if (won && !nativeVictoryReported) {
          nativeVictoryReported = true;
          // The native host additionally validates all four scores and average.
          // A failed set never reports completion, even if the user taps Replay.
          try {
            window.SnoozeLosePerception?.complete?.({
              won: true, average: average, scores: scores.slice(), rounds: 4
            });
          } catch (error) {
            console.error('SnoozeLose completion bridge unavailable:', error);
          }
        }
      }
      function goNext() {
        if (round === 3) showFinal();
        else { round += 1; showRound(); }
      }
      root.addEventListener('click', (event) => {
        const button = event.target.closest('button');
        if (!button || !root.contains(button)) return;
        if (button.dataset.action === 'start') startSet();
        else if (button.dataset.action === 'lock-count') lockCount();
        else if (button.dataset.action === 'lock-angle' && phase === 'question' && round === 2) {
          const error = Math.abs(((angle - targetAngle + 540) % 360) - 180);
          const radTarget = targetAngle * Math.PI / 180, radChosen = angle * Math.PI / 180;
          const tx = 100 + 76 * Math.cos(radTarget), ty = 100 - 76 * Math.sin(radTarget), ux = 100 + 76 * Math.cos(radChosen), uy = 100 - 76 * Math.sin(radChosen);
          const reveal = '<section class="card position-card"><div class="card-label">ANGLE REVEAL · TARGET AND YOUR RAY</div><svg class="angle-reveal" viewBox="0 0 200 200" role="img" aria-label="Target and guessed angle rays"><path d="M24 100H176 M100 24V176"/><path class="target-ray" d="M100 100L' + tx.toFixed(1) + ' ' + ty.toFixed(1) + '"/><path class="your-ray" d="M100 100L' + ux.toFixed(1) + ' ' + uy.toFixed(1) + '"/><circle cx="100" cy="100" r="4"/></svg><div class="ray-legend"><span><i class="target-key"></i>Target ray</span><span><i class="your-key"></i>Your ray</span></div><div class="position-values"><span>Target ' + targetAngle.toFixed(1) + '°</span><span>Your ray ' + angle.toFixed(1) + '°</span></div></section>';
          finishRound(100 - error * 3, 'Your ray was ' + error.toFixed(1) + '° off.', reveal, true);
        }
        else if (button.dataset.action === 'next' && phase === 'feedback') goNext();
        else if (button.dataset.action === 'replay' && phase === 'finished') startSet();
      });
      document.addEventListener('keydown', (event) => {
        if (phase !== 'question' || round !== 0 || event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.key === 'Enter') lockCount();
      });
      content.innerHTML = '<div class="round">FOUR GAMES · ONE SHARP MIND</div><h1>Read the moment.</h1><p class="description">Four quick rounds. Trust your eyes, judge the angles, and see how close you can get.</p><section class="card"><div class="card-label">YOUR CHALLENGE</div><div class="score-grid"><div class="score-cell"><span>01 · ESTIMATE</span><b>Count</b></div><div class="score-cell"><span>02 · PREDICT</span><b>Track</b></div><div class="score-cell"><span>03 · ROTATE</span><b>Angle</b></div><div class="score-cell"><span>04 · PLACE</span><b>Split</b></div></div><p class="hint">100 points per game · 70 average to win</p></section><div class="home-actions"><button type="button" data-action="start">START</button></div>';
      updateProgress();
    })();
  </script>
</div>
